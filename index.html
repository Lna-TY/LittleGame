<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0">

  <title> Atrapa el cuadrado </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      font-size: 22px;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #target {
      position: absolute;
      width: 50px;
      height: 50 px;
      background: red;
      cursor: pointer;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div id="game">
    <div id="target"></div>
  </div>

  <script>
    let score = 0;
    let time = 30;

    cons target = document.getElementById("target");
    cons scoreText = docuemnt.getElementById("score");
    cons timeText = document.getElementById("time");

    function moveTarget() {

      const maxX = window.innerWidth - 60;
      const maxY = window.innerHeight - 60;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    target.addEventListener("click", function() {
      if (time <= 0) return;
      score++;
      score.Text.textContent = score;
      moveTarget();
    });

    const timer = setInterval(function() {
      time--;
      timeText.textContent = time;
      if (time <= 0) {
        clearInterval(timer);
        target.styel.display = "none";
        alert("¡Fin! Has conseguido " + score + " puntos.");
      }
    }, 1000);

    moveTarget();
  </script>
</body>
</html>
